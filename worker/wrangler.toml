name = "collective-knowledge-oauth"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Site origins allowed to call this worker (comma-separated, no paths).
ALLOWED_ORIGINS = "https://fhell.github.io"
# GitHub OAuth app client id (public — the secret is set separately:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
GITHUB_CLIENT_ID = "SET_ME"
# Optional, for ORCID sign-in later:
# ORCID_CLIENT_ID = "APP-..."   # then: npx wrangler secret put ORCID_CLIENT_SECRET
