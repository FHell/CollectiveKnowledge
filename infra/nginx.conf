# Static hosting for the published site (written by CI into the shared
# book-site volume, atomically swapped under current/):
#   /            -> landing page (open changes, sign-in)
#   /book/       -> the built book
#   /diffs/pr-N/ -> rendered AST diff + review bar + discussion per change
#
# Forgejo itself is exposed on its own port (3000); the site's browser
# client talks to its API cross-origin (enable [cors] on Forgejo — see
# docker-compose.yml). If DNS allows, prefer subdomains
# (git.example.org / book.example.org) over ports.

server {
    listen 80;
    server_name _;

    root /srv/site/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
