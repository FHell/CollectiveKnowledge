# Static hosting for the book:
#   /            -> latest built book (deployed by CI on push to main)
#   /diffs/pr-N/ -> rendered AST diff per PR (published by CI on PR sync)
#
# Forgejo itself is exposed on its own port (3000). If DNS allows, prefer
# subdomains (git.example.org / book.example.org) over path prefixes —
# less rewriting pain. This config is the single-host fallback.

server {
    listen 80;
    server_name _;

    root /srv/site/book;
    index index.html;

    location /diffs/ {
        alias /srv/site/diffs/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
