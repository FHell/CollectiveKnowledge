# On every push to main: rebuild the whole public site (landing + book +
# per-open-PR diff pages) and swap it into place on the static host.
name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: docker
    container:
      image: python:3.12-slim-bookworm
      volumes:
        - book-site:/site   # whitelisted in infra/runner-config.yml
    steps:
      - name: Install git and curl
        run: apt-get update -qq && apt-get install -y -qq git curl >/dev/null

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # blame needs history

      - name: Install book tool
        run: |
          git config --global --add safe.directory "$(pwd)"
          pip install --quiet .

      - name: Build site (landing + book + per-PR diffs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: site/build_site.sh site-out

      - name: Deploy (atomic swap)
        run: |
          rm -rf /site/new
          cp -r site-out /site/new
          rm -rf /site/old
          [ -d /site/current ] && mv /site/current /site/old || true
          mv /site/new /site/current
          rm -rf /site/old
