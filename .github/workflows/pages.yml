# Build and deploy the site to GitHub Pages:
#   /            landing page with live open-changes list
#   /book/       the published book (this repository IS the book)
#   /diffs/pr-N/ rendered AST diff + review bar for every open PR
#
# Runs on push to main, on PR open/update (pull_request_target so the
# workflow definition and the checkout always come from main — PR content
# is only read as data via `git show`, never executed), and on demand.
name: pages

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # never build the site from PR code
          fetch-depth: 0       # blame needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install book tool
        run: pip install --quiet .

      - name: Build site (book + per-PR diffs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: site/build_site.sh public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
