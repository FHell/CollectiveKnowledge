[book]
title = "Collective Knowledge"

[site]
# Where the built site is published (the nginx service in infra/).
# Used only for printing helpful URLs; CI owns actual deployment.
# base_url = "https://book.example.org"
# diffs_url = "https://book.example.org/diffs"

# One-click sign-in on the published site: a *public* OAuth2 app (PKCE,
# no secret) on the Forgejo instance — infra/bootstrap.sh registers one
# and prints its client_id. Pasted tokens work without this.
# [oauth]
# client_id = "<Forgejo OAuth2 app client id>"
